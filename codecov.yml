codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "0...100"
  status:
    project:
      default:
        target: 95%
        threshold: 5%
        if_ci_failed: error
        informational: false
    patch:
      default:
        target: 100%
        threshold: 2%
        only_pulls: true

comment:
  layout: "header, diff, files"
  require_changes: true
